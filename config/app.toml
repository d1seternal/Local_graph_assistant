[server]
host = "127.0.0.1"
port = 8000
workers = 1

[generation]
model = "qwen2.5:3b"
url = "http://127.0.0.1:11434/api/chat"
num_ctx = 4096
num_predict = 384
temperature = 0.0
stream = false
keep_alive = 0
socket_timeout_seconds = 120
max_response_bytes = 131072
system_prompt_path = "config/prompts/answer.txt"

[context]
max_prompt_bytes = 3000
min_excerpt_bytes = 160

[embeddings]
model_id = "intfloat/multilingual-e5-small"
model_path = "models/embeddings/multilingual-e5-small"
device = "cpu"
cpu_threads = 2
batch_size = 8
query_prefix = "query: "
passage_prefix = "passage: "

[indexing]
chunk_tokens = 256
overlap_tokens = 32
max_chunks = 5000
parse_timeout_seconds = 30
timeout_seconds = 180

[limits]
active_tasks = 1
queue_capacity = 10
queue_wait_seconds = 60
request_deadline_seconds = 180
model_calls = 3
tool_calls = 2
file_bytes = 10485760
pdf_pages = 50
extracted_characters = 500000

